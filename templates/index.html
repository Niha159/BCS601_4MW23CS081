<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 5px;
        }

        button {
            width: 22%;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
<div class="box">
    <h2>Calculator</h2>

    <form method="POST">
        <input type="number" step="any" name="num1" placeholder="First Number" required>
        <input type="number" step="any" name="num2" placeholder="Second Number" required>

        <div>
            <button name="operation" value="+">+</button>
            <button name="operation" value="-">-</button>
            <button name="operation" value="*">*</button>
            <button name="operation" value="/">/</button>
        </div>
    </form>

    <div class="result">
        Result: {{ result }}
    </div>
</div>
</body>
</html>
